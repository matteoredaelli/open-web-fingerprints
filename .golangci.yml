version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - errorlint
    - gosec
  exclusions:
    rules:
      # Tests build fixtures with git and temp files; gosec adds noise there.
      - path: _test\.go
        linters:
          - gosec
  settings:
    errcheck:
      # Writing to stdout/stderr or a tabwriter: failures are not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
formatters:
  enable:
    - gofmt
